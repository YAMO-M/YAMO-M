name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:      
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          github_user_name: YAMO-M
          outputs: output/github-contribution-grid-snake.svg
          
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output
          branch: output
